name: containerize
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
      - run: npm clean-install
      - run: npm run test

  build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set lowercase for image name
        run: echo "IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/ship-dashboard:latest" >> $GITHUB_ENV
      - name: Display image name
        run: echo "Image name ${{ env.IMAGE_NAME }}"
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}           

permissions:
  packages: write

